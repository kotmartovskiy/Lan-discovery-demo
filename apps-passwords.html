<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    margin: 0;
    padding: 16px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
}
::-webkit-scrollbar { width: 0; height: 0; }

.app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.app-header h2 {
    font-size: 18px;
    color: #e6edf3;
    flex: 1;
    min-width: 0;
}
.app-btn {
    padding: 8px 16px;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #21262d;
    color: #c9d1d9;

.app-btn.danger { background: #da3633; border-color: #da3633; color: #fff; }
.app-btn.danger:hover { background: #f85149; }
.app-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
}
.card-title {
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
}

.empty-state {
    text-align: center;
    padding: 48px 20px;
    color: #484f58;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.5; }

.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;

}
.badge-green { background: rgba(35,134,54,0.3); color: #3fb950; }
.badge-blue { background: rgba(56,132,244,0.2); color: #58a6ff; }
.badge-yellow { background: rgba(187,128,9,0.2); color: #d29922; }
.badge-red { background: rgba(218,54,51,0.2); color: #f85149; }
.badge-gray { background: rgba(110,118,129,0.2); color: #8b949e; }

.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #238636; }
.toast.error { background: #da3633; }
.toast.info { background: #1f6feb; }

.spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(88,166,255,0.3);
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #21262d; font-size: 13px; }
th { color: #8b949e; font-weight: 600; background: #0d1117; position: sticky; top: 0; }
td { color: #c9d1d9; }

input[type="text"], input[type="number"], input[type="password"], input[type="search"], select, textarea {
    background: #0d1117;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { border-color: #58a6ff; }

.mono { font-family: 'SF Mono', 'Fira Code', monospace; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.flex-1 { flex: 1; min-width: 0; }
.mb-12 { margin-bottom: 12px; }
.text-green { color: #3fb950; }
.text-red { color: #f85149; }
.text-yellow { color: #d29922; }
.text-gray { color: #8b949e; }
.text-blue { color: #58a6ff; }
</style>

<body>
<script>var USER_ROLE = "admin";</script>

<style>

.page-title { color: #fff; font-size: 20px; font-weight: 600; margin: 0 0 16px 0; }

.tabs-row { display: flex; gap: 0; margin-bottom: 20px; }
.tab-btn { background: #111; color: #888; border: 1px solid #333; border-bottom: none; border-radius: 8px 8px 0 0; padding: 10px 28px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.tab-btn.active { background: #1a1a2e; color: #fff; border-color: #2563eb; border-bottom: 2px solid #1a1a2e; position: relative; top: 1px; }
.tab-btn:hover:not(.active) { color: #ccc; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.gen-section { background: #111; border: 1px solid #333; border-radius: 8px; padding: 24px; max-width: 600px; }

.pw-display-wrap { position: relative; margin-bottom: 16px; }
.pw-display { font-size: 24px; font-family: monospace; background: #111; border: 1px solid #333; border-radius: 8px; padding: 16px; text-align: center; letter-spacing: 2px; color: #2563eb; word-break: break-all; min-height: 24px; user-select: all; }

.pw-copy-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

.strength-bar-wrap { height: 6px; background: #222; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }

.slider-wrap input[type="range"] { flex: 1; accent-color: #2563eb; }
.slider-val { color: #fff; font-weight: bold; min-width: 28px; text-align: center; }

.checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.checkbox-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #ccc; font-size: 14px; }
.checkbox-row input[type="checkbox"] { accent-color: #2563eb; }

.gen-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 10px 24px; cursor: pointer; font-size: 14px; font-weight: 600; }
.gen-btn:hover { background: #1d4ed8; }

.no-access { background: #111; border: 1px solid #333; border-radius: 8px; padding: 40px; text-align: center; color: #888; }

.secret-add-btn:hover { background: #1d4ed8; }

.secret-card { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.secret-card-top { display: flex; justify-content: space-between; align-items: center; }
.secret-card-name { font-weight: bold; color: #fff; font-size: 15px; cursor: pointer; flex: 1; }
.secret-card-actions { display: flex; gap: 6px; }
.secret-card-actions button { background: #222; color: #aaa; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

.secret-card-actions .btn-del:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

.secret-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; }
.secret-details.open { display: block; }
.secret-field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.secret-field label { min-width: 100px; color: #888; font-size: 13px; flex-shrink: 0; }
.secret-field .field-val { flex: 1; font-family: monospace; font-size: 14px; color: #ccc; word-break: break-all; }
.secret-field .pw-masked { color: #555; letter-spacing: 3px; }
.secret-field .toggle-pw { background: none; border: none; color: #2563eb; cursor: pointer; padding: 2px 6px; font-size: 16px; }
.secret-field .copy-mini { background: none; border: none; color: #888; cursor: pointer; padding: 2px 6px; font-size: 14px; }
.secret-field .copy-mini:hover { color: #2563eb; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; justify-content: center; align-items: center; }
.modal-overlay.open { display: flex; }
.modal-box { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 24px; width: 420px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal-box h3 { margin-top: 0; color: #fff; font-size: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; margin-bottom: 4px; color: #888; font-size: 13px; }
.modal-field input, .modal-field textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 4px; color: #fff; padding: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
.modal-field textarea { height: 60px; resize: vertical; }
.modal-field input:focus, .modal-field textarea:focus { border-color: #2563eb; outline: none; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btns button { border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 14px; border: none; }
.btn-save { background: #2563eb; color: #fff; }
.btn-save:hover { background: #1d4ed8; }
.btn-cancel { background: #333; color: #ccc; }
.btn-cancel:hover { background: #444; }
.btn-gen-in-modal { background: #222; color: #8ab4f8; border: 1px solid #444; font-size: 12px; padding: 4px 10px; margin-left: 6px; cursor: pointer; border-radius: 4px; }
.btn-gen-in-modal:hover { background: #333; color: #fff; }
.modal-pw-row { display: flex; align-items: center; gap: 0; }
.modal-pw-row input { border-radius: 4px 0 0 4px; }

.secrets-empty { text-align: center; padding: 40px 20px; color: #555; }
</style>

<div class="page-title">🔐 Генератор паролей</div>

<div class="tabs-row">
    <button class="tab-btn active" onclick="switchTab('generator')">Генератор</button>
    <button class="tab-btn" onclick="switchTab('secrets')">Секреты</button>
</div>

<div id="tab-generator" class="tab-panel active">
    <div class="gen-section">
        <div class="pw-display-wrap">
            <div class="pw-display" id="pwDisplay"></div>
            <button class="pw-copy-btn" onclick="copyPassword()" title="Копировать">📋 Копировать</button>
        </div>

        <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel"></div>

        <div class="slider-wrap">
            <label style="color:#aaa; white-space:nowrap;">Длина:</label>
            <input type="range" id="pwLength" min="8" max="64" value="16" oninput="updateLength()">
            <span class="slider-val" id="pwLengthVal">16</span>
        </div>

        <div class="checkbox-row">
            <label><input type="checkbox" id="chkLetters" checked> Буквы</label>
            <label><input type="checkbox" id="chkDigits" checked> Цифры</label>
            <label><input type="checkbox" id="chkSymbols"> Символы (!@#$%^&*)</label>
        </div>

        <button class="gen-btn" onclick="doGenerate()">Сгенерировать</button>
    </div>
</div>

<div id="tab-secrets" class="tab-panel">
    <div id="secretsContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
        <h3 id="modalTitle">Новый секрет</h3>
        <input type="hidden" id="modalSecretId">
        <div class="modal-field">
            <label>Название</label>
            <input type="text" id="modalName" placeholder="Например: GitHub">
        </div>
        <div class="modal-field">
            <label>Логин</label>
            <input type="text" id="modalLogin" placeholder="user@example.com">
        </div>
        <div class="modal-field">
            <label>Пароль</label>
            <div class="modal-pw-row">
                <input type="text" id="modalPassword" placeholder="Пароль">
                <button class="btn-gen-in-modal" onclick="fillModalPassword()" title="Сгенерировать пароль">🎲</button>
            </div>
        </div>
        <div class="modal-field">
            <label>URL</label>
            <input type="text" id="modalUrl" placeholder="https://example.com">
        </div>
        <div class="modal-field">
            <label>Заметки</label>
            <textarea id="modalNotes" placeholder="Любые заметки..."></textarea>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-save" onclick="saveSecret()">Сохранить</button>
        </div>
    </div>
</div>

<script>
var currentTab = 'generator';
var secrets = [];
var secretsMap = {};
var isRoot = (typeof USER_ROLE !== 'undefined' && USER_ROLE === 'admin');
var pwVisible = {};

function switchTab(tab) {
    currentTab = tab;
    var btns = document.querySelectorAll('.tab-btn');
    btns[0].classList.toggle('active', tab === 'generator');
    btns[1].classList.toggle('active', tab === 'secrets');
    document.getElementById('tab-generator').classList.toggle('active', tab === 'generator');
    document.getElementById('tab-secrets').classList.toggle('active', tab === 'secrets');
    if (tab === 'secrets') renderSecrets();
}

function generatePassword(length, upper, lower, digits, symbols) {
    var chars = '';
    if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (digits) chars += '0123456789';
    if (symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
    var pw = '';
    for (var i = 0; i < length; i++) pw += chars.charAt(Math.floor(Math.random() * chars.length));
    return pw;
}

function updateLength() {
    document.getElementById('pwLengthVal').textContent = document.getElementById('pwLength').value;
}

function calcStrength(pw) {
    var score = 0;
    if (pw.length >= 12) score += 25;
    else if (pw.length >= 8) score += 15;
    if (pw.length >= 20) score += 15;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score += 20;
    if (/\d/.test(pw)) score += 20;
    if (/[^a-zA-Z0-9]/.test(pw)) score += 20;
    return Math.min(100, score);
}

function updateStrength(pw) {
    var pct = calcStrength(pw);
    var bar = document.getElementById('strengthBar');
    var label = document.getElementById('strengthLabel');
    bar.style.width = pct + '%';
    if (pct < 30) { bar.style.background = '#e74c3c'; label.textContent = 'Слабый'; label.style.color = '#e74c3c'; }
    else if (pct < 60) { bar.style.background = '#f39c12'; label.textContent = 'Средний'; label.style.color = '#f39c12'; }
    else if (pct < 80) { bar.style.background = '#2ecc71'; label.textContent = 'Хороший'; label.style.color = '#2ecc71'; }
    else { bar.style.background = '#27ae60'; label.textContent = 'Отличный'; label.style.color = '#27ae60'; }
}

function doGenerate() {
    var len = parseInt(document.getElementById('pwLength').value);
    var letters = document.getElementById('chkLetters').checked;
    var digits = document.getElementById('chkDigits').checked;
    var symbols = document.getElementById('chkSymbols').checked;
    var pw = generatePassword(len, letters, letters, digits, symbols);
    document.getElementById('pwDisplay').textContent = pw;
    updateStrength(pw);
}

function copyPassword() {
    var text = document.getElementById('pwDisplay').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(function() {
        var btn = document.querySelector('.pw-copy-btn');
        btn.textContent = '✅ Скопировано';
        setTimeout(function() { btn.textContent = '📋 Копировать'; }, 1500);
    });
}

function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function renderSecrets() {
    var el = document.getElementById('secretsContent');
    if (!isRoot) {
        el.innerHTML = '<div class="no-access">🔒 Только для admin</div>';
        return;
    }
    el.innerHTML = '<button class="secret-add-btn" onclick="openAddModal()">+ Добавить секрет</button><div id="secretsList"></div>';
    loadSecrets();
}

function loadSecrets() {
    fetch('api/secrets').then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            secrets = d.secrets;
            secretsMap = {};
            for (var i = 0; i < secrets.length; i++) secretsMap[secrets[i].id] = secrets[i];
            renderSecretsList();
        }
    }).catch(function() {});
}

function renderSecretsList() {
    var el = document.getElementById('secretsList');
    if (!el) return;
    if (!secrets.length) {
        el.innerHTML = '<div class="secrets-empty">Нет сохранённых секретов</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < secrets.length; i++) {
        var s = secrets[i];
        html += '<div class="secret-card" id="secret-' + s.id + '">' +
            '<div class="secret-card-top">' +
                '<span class="secret-card-name" onclick="toggleSecret(' + s.id + ')">' + escHtml(s.name || 'Без названия') + '</span>' +
                '<div class="secret-card-actions">' +
                    '<button onclick="openEditModal(' + s.id + ')">✏️</button>' +
                    '<button class="btn-del" onclick="deleteSecret(' + s.id + ')">🗑️</button>' +
                '</div>' +
            '</div>' +
            '<div class="secret-details" id="detail-' + s.id + '">' +
                '<div class="secret-field"><label>Логин:</label><span class="field-val">' + escHtml(s.login || '—') + '</span>' +
                    '<button class="copy-mini" onclick="copyField(this, ' + s.id + ', \'login\')" title="Копировать">📋</button></div>' +
                '<div class="secret-field"><label>Пароль:</label><span class="field-val pw-masked" id="pwfield-' + s.id + '">••••••••</span>' +
                    '<button class="toggle-pw" onclick="togglePw(' + s.id + ')" title="Показать/скрыть">👁️</button>' +
                    '<button class="copy-mini" onclick="copyField(this, ' + s.id + ', \'password\')" title="Копировать">📋</button></div>' +
                (s.url ? '<div class="secret-field"><label>URL:</label><span class="field-val"><a href="' + escHtml(s.url) + '" target="_blank" style="color:#8ab4f8;">' + escHtml(s.url) + '</a></span></div>' : '') +
                (s.notes ? '<div class="secret-field"><label>Заметки:</label><span class="field-val">' + escHtml(s.notes) + '</span></div>' : '') +
            '</div>' +
        '</div>';
    }
    el.innerHTML = html;
}

function toggleSecret(id) {
    var det = document.getElementById('detail-' + id);
    if (det) det.classList.toggle('open');
}

function togglePw(id) {
    var field = document.getElementById('pwfield-' + id);
    var s = secretsMap[id];
    if (!s) return;
    pwVisible[id] = !pwVisible[id];
    if (pwVisible[id]) {
        field.textContent = s.password;
        field.classList.remove('pw-masked');
    } else {
        field.textContent = '••••••••';
        field.classList.add('pw-masked');
    }
}

function copyField(btn, id, key) {
    var s = secretsMap[id];
    if (!s) return;
    var text = s[key] || '';
    navigator.clipboard.writeText(text).then(function() {
        var orig = btn.textContent;
        btn.textContent = '✅';
        setTimeout(function() { btn.textContent = orig; }, 1200);
    });
}

function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Новый секрет';
    document.getElementById('modalSecretId').value = '';
    document.getElementById('modalName').value = '';
    document.getElementById('modalLogin').value = '';
    document.getElementById('modalPassword').value = '';
    document.getElementById('modalUrl').value = '';
    document.getElementById('modalNotes').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalName').focus();
}

function openEditModal(id) {
    var s = secretsMap[id];
    if (!s) return;
    document.getElementById('modalTitle').textContent = 'Редактировать секрет';
    document.getElementById('modalSecretId').value = s.id;
    document.getElementById('modalName').value = s.name || '';
    document.getElementById('modalLogin').value = s.login || '';
    document.getElementById('modalPassword').value = s.password || '';
    document.getElementById('modalUrl').value = s.url || '';
    document.getElementById('modalNotes').value = s.notes || '';
    document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}

function fillModalPassword() {
    document.getElementById('modalPassword').value = generatePassword(20, true, true, true, true);
}

function saveSecret() {
    var id = document.getElementById('modalSecretId').value;
    var data = {
        name: document.getElementById('modalName').value,
        login: document.getElementById('modalLogin').value,
        password: document.getElementById('modalPassword').value,
        url: document.getElementById('modalUrl').value,
        notes: document.getElementById('modalNotes').value
    };
    var url = id ? 'api/secrets/' + id : 'api/secrets';
    var method = id ? 'PUT' : 'POST';
    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            closeModal();
            loadSecrets();
        }
    }).catch(function() {});
}

function deleteSecret(id) {
    if (!confirm('Удалить этот секрет?')) return;
    fetch('api/secrets/' + id, { method: 'DELETE' }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
            delete secretsMap[id];
            loadSecrets();
        }
    }).catch(function() {});
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

doGenerate();
</script>
